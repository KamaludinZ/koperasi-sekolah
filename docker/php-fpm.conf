; Pool php-fpm production (menimpa www.conf bawaan image). Angka proses bisa diatur lewat env PHP_FPM_*.
[global]
error_log = /proc/self/fd/2
log_limit = 8192

[www]
user = www-data
group = www-data
; Hanya nginx di kontainer yang sama yang berbicara dengan php-fpm.
listen = 127.0.0.1:9000

; ondemand: proses dibuat saat ada permintaan dan dimatikan setelah menganggur — hemat memori untuk
; beban koperasi sekolah; batas atas permintaan PHP bersamaan = PHP_FPM_MAX_CHILDREN.
pm = ondemand
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.process_idle_timeout = 60s
pm.max_requests = 1000

request_terminate_timeout = 150s
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
