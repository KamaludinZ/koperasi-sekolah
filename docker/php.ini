; Pengaturan PHP production Koperasi Sekolah (dimuat setelah bawaan image).

expose_php = Off
memory_limit = ${PHP_MEMORY_LIMIT}
max_execution_time = 120
max_input_time = 120
max_input_vars = 5000

; Unggahan terbesar di aplikasi 10 MB (Livewire temporary upload, impor barang XLSX, bukti pencairan).
upload_max_filesize = 16M
post_max_size = 20M

date.timezone = ${TZ}

display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

session.use_strict_mode = 1
session.cookie_httponly = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Kode tidak berubah selama kontainer hidup → tidak perlu memeriksa timestamp berkas.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.jit = off
