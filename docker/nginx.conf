# nginx di dalam kontainer: melayani public/ dan meneruskan PHP ke php-fpm (127.0.0.1:9000).
# TLS, sertifikat & domain diurus reverse proxy di depan (Traefik Coolify / Caddy / Nginx host).
user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout combined;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Batas unggahan aplikasi 10 MB (+ ruang untuk isian form).
    client_max_body_size 20m;
    client_body_buffer_size 128k;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    server {
        listen 8080 default_server;
        server_name _;

        root /var/www/html/public;
        index index.php;
        charset utf-8;

        # Aset hasil build Vite: nama berkas berisi hash → aman di-cache lama.
        location /build/ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Service worker kasir offline: selalu diperiksa ulang agar pembaruan langsung sampai ke perangkat kasir.
        location = /sw.js {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        location = /favicon.ico { access_log off; log_not_found off; try_files $uri =404; }
        location = /robots.txt  { access_log off; log_not_found off; try_files $uri =404; }

        # Pemeriksaan kesehatan aplikasi dari Docker/Coolify tidak perlu memenuhi log.
        location = /up {
            access_log off;
            try_files $uri /index.php?$query_string;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /index.php {
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param HTTP_PROXY "";
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_read_timeout 150s;
        }

        # Hanya front controller yang boleh dieksekusi; berkas tersembunyi & .php lain ditolak.
        location ~ \.php$ { return 404; }
        location ~ /\.(?!well-known) { deny all; }
    }
}
