; Proses di dalam kontainer. Program mana yang hidup ditentukan entrypoint dari CONTAINER_ROLE
; (SUPERVISOR_WEB / SUPERVISOR_QUEUE / SUPERVISOR_SCHEDULER = true|false).
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisord.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=%(ENV_SUPERVISOR_WEB)s
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=%(ENV_SUPERVISOR_WEB)s
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Urutan antrean sesuai config/koperasi.php (notifikasi → ekspor → default → cadangan).
; --max-time: pekerja diperbarui tiap jam agar memori tetap bersih.
[program:queue]
command=php /var/www/html/artisan queue:work --queue=notifikasi,ekspor,default,cadangan --tries=3 --timeout=900 --sleep=3 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=%(ENV_QUEUE_WORKERS)s
user=www-data
autostart=%(ENV_SUPERVISOR_QUEUE)s
autorestart=true
startsecs=0
stopwaitsecs=120
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php /var/www/html/artisan schedule:work
user=www-data
autostart=%(ENV_SUPERVISOR_SCHEDULER)s
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
